<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard ARK</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2 class="title">ARK Panel</h2>

        <button class="menu-btn" data-section="youtube">📺 YouTube</button>
        <button class="menu-btn" data-section="maps">🗺️ Google Maps</button>
        <button class="menu-btn" data-section="videos">🎥 Videos R2</button>
        <button class="menu-btn" data-section="ia">🦖 IA Dinosaurios</button>
        <button class="menu-btn" data-section="map3d">🌋 Mapbox 3D</button>
        <button class="menu-btn" data-section="pagos">💳 Donaciones</button>

        <button id="logout-btn" class="menu-btn logout">Cerrar sesión</button>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="content">
        <h1>Bienvenido al panel ARK </h1>
        <p>Selecciona una opción del menú para comenzar.</p>
    </main>

    <script src="script_dashboard.js"></script>
</body>
</html>
